journals:
  - key: nature
    publisher: nature
    journal: Nature
    issn: "0028-0836"
    sources: [{type: rss, url: "https://www.nature.com/nature.rss"}]
  - key: nature_energy
    publisher: nature
    journal: Nature Energy
    issn: "2058-7546"
    sources: [{type: rss, url: "https://www.nature.com/nenergy.rss"}]
  - key: nature_materials
    publisher: nature
    journal: Nature Materials
    issn: "1476-1122"
    sources: [{type: rss, url: "https://www.nature.com/nmat.rss"}]
  - key: nature_chemistry
    publisher: nature
    journal: Nature Chemistry
    issn: "1755-4330"
    sources: [{type: rss, url: "https://www.nature.com/nchem.rss"}]
  - key: nature_sustainability
    publisher: nature
    journal: Nature Sustainability
    issn: "2398-9629"
    sources: [{type: rss, url: "https://www.nature.com/natsustain.rss"}]
  - key: nature_communications
    publisher: nature
    journal: Nature Communications
    issn: "2041-1723"
    sources:
      - {type: rss, url: "https://www.nature.com/ncomms.rss"}
      - {type: rss, url: "https://www.nature.com/subjects/physical-sciences/ncomms.rss"}
  - key: nature_reviews_chemistry
    publisher: nature
    journal: Nature Reviews Chemistry
    issn: "2397-3358"
    sources: [{type: rss, url: "https://www.nature.com/natrevchem.rss"}]
  - key: nature_reviews_materials
    publisher: nature
    journal: Nature Reviews Materials
    issn: "2058-8437"
    sources: [{type: rss, url: "https://www.nature.com/natrevmats.rss"}]
  - key: science
    publisher: aaas
    journal: Science
    issn: "0036-8075"
    sources: [{type: rss, url: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science"}]
  - key: science_advances
    publisher: aaas
    journal: Science Advances
    issn: "2375-2548"
    sources: [{type: rss, url: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=sciadv"}]
  - key: jacs
    publisher: acs
    journal: JACS
    issn: "0002-7863"
    sources: [{type: rss, url: "https://pubs.acs.org/action/showFeed?type=axatoc&feed=rss&jc=jacsat"}]
  - key: joule
    publisher: cell
    journal: Joule
    issn: "2542-4351"
    sources:
      - {type: rss, url: "https://www.cell.com/joule/inpress.rss"}
      - {type: rss, url: "https://www.cell.com/joule/current.rss"}
  - key: energy_environmental_science
    publisher: rsc
    journal: Energy & Environmental Science
    issn: "1754-5692"
    # RSC deposits year-only pub dates in Crossref, so from-pub-date matches
    # nothing; use from-created-date instead. Never from-index-date: RSC
    # re-indexes decades-old papers (2026-10-31 incident). RSS is kept as a
    # source but Cloudflare truncates it for this host ("Response ended
    # prematurely"), so backfill is the effective route for EES.
    crossref_date_filter: from-created-date
    sources: [{type: rss, url: "https://pubs.rsc.org/en/journals/journalissues/ee?feed=rss"}]
  - key: nature_nanotechnology
    publisher: nature
    journal: Nature Nanotechnology
    issn: "1748-3387"
    sources: [{type: rss, url: "https://www.nature.com/nnano.rss"}]
  - key: nature_reviews_clean_technology
    publisher: nature
    journal: Nature Reviews Clean Technology
    issn: "3005-0685"
    sources: [{type: rss, url: "https://www.nature.com/nrct.rss"}]
crossref:
  enabled: true
  base_url: https://api.crossref.org
  mailto: "your-email@example.com"
